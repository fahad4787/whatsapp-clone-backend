services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivora
      POSTGRES_PASSWORD: aivora
      POSTGRES_DB: aivora
    ports:
      - "5432:5432"
    volumes:
      - aivora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivora -d aivora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - aivora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aivora_pg:
  aivora_redis:
