# Render Blueprint — create Postgres + Redis + API from this file in the dashboard.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aivora-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aivora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aivora-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: OTP_DEV_BYPASS
        value: "1"
      - key: CORS_ORIGIN
        sync: false

  - type: keyvalue
    name: aivora-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: aivora-postgres
    plan: free
    databaseName: aivora
    user: aivora
